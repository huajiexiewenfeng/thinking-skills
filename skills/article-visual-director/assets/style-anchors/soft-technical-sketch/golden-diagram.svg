<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">Building a mental model style anchor</title>
  <desc id="desc">Question, Example, and Prior Knowledge converge into Mental Model. Mental Model leads to Practice, which leads to Understanding.</desc>
  <defs>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#524A43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper-wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.29  0 0 0 0 0.26  0 0 0 0.08 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .heading { font-family: Aptos, Arial, sans-serif; fill: #524A43; font-size: 32px; font-weight: 650; letter-spacing: 0.8px; }
      .subhead { font-family: Aptos, Arial, sans-serif; fill: #756B62; font-size: 18px; font-weight: 400; }
      .label { font-family: Aptos, Arial, sans-serif; fill: #524A43; font-size: 21px; font-weight: 650; text-anchor: middle; }
      .note { font-family: Aptos, Arial, sans-serif; fill: #756B62; font-size: 15px; font-weight: 400; text-anchor: middle; }
      .edge { fill: none; stroke: #524A43; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
      .soft-outline { stroke: #524A43; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1536" height="864" fill="#F6F0E3"/>
  <rect width="1536" height="864" fill="#F6F0E3" opacity="0.28" filter="url(#paper-wash)"/>

  <g id="diagram-heading" transform="translate(104 88)">
    <path d="M0 4 C4 1 8 2 10 5 V72 C8 76 4 75 1 72 Z" fill="#91AFC4" opacity="0.72"/>
    <text class="heading" x="32" y="34">BUILDING A MENTAL MODEL</text>
    <text class="subhead" x="32" y="66">Three gentle inputs become one path toward understanding.</text>
  </g>

  <g id="edges" aria-label="Five exact directed edges">
    <path id="edge-question-model" data-edge-type="primary" class="edge" d="M306 240 C418 244 438 324 508 380"/>
    <path id="edge-example-model" data-edge-type="primary" class="edge" d="M306 424 C402 424 442 424 508 424"/>
    <path id="edge-prior-model" data-edge-type="primary" class="edge" d="M306 608 C418 604 438 522 508 468"/>
    <path id="edge-model-practice" data-edge-type="primary" class="edge" d="M736 424 C796 424 832 424 890 424"/>
    <path id="edge-practice-understanding" data-edge-type="primary" class="edge" d="M1066 424 C1120 424 1150 424 1204 424"/>
  </g>

  <g id="node-question" data-node-id="question" transform="translate(190 240)">
    <path class="soft-outline" d="M-62 -46 C-38 -70 25 -68 58 -42 C78 -16 66 31 36 51 C3 67 -42 61 -64 30 C-80 4 -80 -24 -62 -46 Z" fill="#D8E4EC" fill-opacity="0.72"/>
    <path d="M-12 -16 C-10 -35 22 -37 25 -14 C28 4 4 8 4 24" fill="none" stroke="#524A43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="4" cy="38" r="3.5" fill="#524A43"/>
    <text class="label" x="0" y="88">QUESTION</text>
    <text class="note" x="0" y="112">what needs explaining</text>
  </g>

  <g id="node-example" data-node-id="example" transform="translate(190 424)">
    <path class="soft-outline" d="M-62 -43 C-36 -62 34 -62 61 -37 C77 -7 64 34 32 51 C-6 63 -48 53 -66 21 C-76 -5 -77 -25 -62 -43 Z" fill="#DCE8D7" fill-opacity="0.76"/>
    <rect x="-23" y="-27" width="46" height="54" rx="5" fill="none" stroke="#524A43" stroke-width="2.4"/>
    <path d="M-13 -12 H13 M-13 0 H10 M-13 12 H5" stroke="#524A43" stroke-width="2.2" stroke-linecap="round"/>
    <text class="label" x="0" y="88">EXAMPLE</text>
    <text class="note" x="0" y="112">a concrete case</text>
  </g>

  <g id="node-prior-knowledge" data-node-id="prior-knowledge" transform="translate(190 608)">
    <path class="soft-outline" d="M-61 -45 C-30 -66 29 -63 59 -39 C76 -9 66 30 39 50 C2 67 -45 57 -65 23 C-75 -2 -76 -27 -61 -45 Z" fill="#D8E4EC" fill-opacity="0.62"/>
    <path d="M-26 12 L0 -18 L26 12 V28 H-26 Z" fill="none" stroke="#524A43" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-12 28 V7 H12 V28" fill="none" stroke="#524A43" stroke-width="2.2"/>
    <text class="label" x="0" y="88">PRIOR KNOWLEDGE</text>
    <text class="note" x="0" y="112">what is already known</text>
  </g>

  <g id="node-mental-model" data-node-id="mental-model" transform="translate(622 424)">
    <path class="soft-outline" d="M-105 -88 C-58 -122 53 -116 101 -72 C132 -25 118 62 64 98 C0 124 -78 99 -108 42 C-126 -7 -127 -52 -105 -88 Z" fill="#E8D3A9" fill-opacity="0.78"/>
    <path d="M-45 -6 C-45 -41 -13 -58 13 -44 C35 -56 63 -36 60 -9 C62 18 37 32 14 25 C-8 43 -43 27 -45 -6 Z" fill="none" stroke="#524A43" stroke-width="2.6"/>
    <path d="M-20 -14 C-4 -4 10 -4 31 -18 M-19 8 C-1 18 17 17 37 4" fill="none" stroke="#524A43" stroke-width="2" stroke-linecap="round"/>
    <text class="label" x="0" y="146">MENTAL MODEL</text>
    <text class="note" x="0" y="171">an organized explanation</text>
  </g>

  <g id="node-practice" data-node-id="practice" transform="translate(978 424)">
    <path class="soft-outline" d="M-74 -64 C-40 -84 43 -81 72 -53 C91 -15 78 42 41 64 C0 83 -55 71 -76 32 C-88 -2 -88 -40 -74 -64 Z" fill="#D8E4EC" fill-opacity="0.78"/>
    <path d="M-31 18 L-8 -8 L7 7 L31 -22" fill="none" stroke="#524A43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-31" cy="18" r="4" fill="#524A43"/>
    <circle cx="31" cy="-22" r="4" fill="#524A43"/>
    <text class="label" x="0" y="108">PRACTICE</text>
    <text class="note" x="0" y="132">use the model</text>
  </g>

  <g id="node-understanding" data-node-id="understanding" transform="translate(1314 424)">
    <path class="soft-outline" d="M-83 -66 C-42 -88 48 -83 79 -47 C96 -5 80 45 42 69 C-5 86 -60 70 -84 28 C-97 -5 -96 -43 -83 -66 Z" fill="#DCE8D7" fill-opacity="0.82"/>
    <path d="M-28 0 L-7 21 L31 -23" fill="none" stroke="#524A43" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="0" y="108">UNDERSTANDING</text>
    <text class="note" x="0" y="132">a usable explanation</text>
  </g>

  <text x="1432" y="782" text-anchor="end" class="subhead">Style reference only — example topology is non-authoritative</text>
</svg>
